version: "3.9"

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home

  ngrok:
    image: wernight/ngrok
    container_name: ngrok
    environment:
      NGROK_AUTHTOKEN: <your-ngrok-token>
      NGROK_PORT: jenkins:8080
    depends_on:
      - jenkins
    restart: unless-stopped

volumes:
  jenkins_home:
